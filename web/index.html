<!doctype html>
<!-- 整份 app 的殼。React 會把畫面畫進 #root。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 手機寬度不要被縮放成桌面版再縮小 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>essences — 文件欄位審核</title>
    <!-- 標題用 Fraunces、內文用 IBM Plex Sans；preconnect 讓字體下載快一點 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- type=module 才能 import .tsx；Vite 開發時會把這支轉成瀏覽器看得懂的 JS -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
