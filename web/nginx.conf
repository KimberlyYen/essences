# Docker 裡的前端：靜態檔 + 把 /api 轉給 api 容器。
# SSE 必須關掉 proxy_buffering，否則進度會卡住等到解析結束才一次噴出來。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 空 Connection，避免 nginx 把 SSE 連線改成 keepalive 後卡住
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no always;
    }

    # SPA：找不到實體檔就回 index.html，讓前端自己切畫面
    location / {
        try_files $uri $uri/ /index.html;
    }
}
